{% with current=request.resolver_match.url_name %}
<aside class="sidebar">
  <a class="brand" href="{% url 'home' %}"><span class="disc" aria-hidden="true"></span>Spotibai</a>
  <nav class="side-nav" aria-label="Main">
    <a href="{% url 'home' %}"{% if current == 'home' %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home
    </a>
    <a href="{% url 'trending' %}"{% if current == 'trending' %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 17l6-6 4 4 7-7h-4V6h8v8h-2v-4.6l-8 8-4-4-4.6 4.6z"/></svg>Trending
    </a>
    <a href="{% url 'playlists' %}"{% if current == 'playlists' or current == 'playlist_detail' %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 6h14v2H3zm0 5h14v2H3zm0 5h9v2H3zm13-1v-4l5 2z"/></svg>Playlist
    </a>
    <a href="{% url 'liked' %}"{% if current == 'liked' %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>Liked Songs
    </a>
    <a href="{% url 'recent' %}"{% if current == 'recent' %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 2a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm-1 2v5.4l3.8 2.3 1-1.6-2.8-1.7V7z"/></svg>Recent Music
    </a>
    <a href="{% url 'account' %}"{% if current == 'account' or current == 'settings' %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg>Account
    </a>
  </nav>
  <a class="side-logout" href="{% url 'login' %}">Log Out</a>
</aside>
{% endwith %}
