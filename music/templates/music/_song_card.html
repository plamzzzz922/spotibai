{% load static %}<article class="card" data-song-id="{{ song.id }}">
  <div class="cover-wrap">
    <a class="cover" href="{% url 'player' song.id %}" aria-label="Play {{ song.title }} by {{ song.artist }}">
      {% if song.cover %}<img src="{% static song.cover %}" alt="">{% endif %}
    </a>
    <button type="button" class="star like-btn" data-like="{{ song.id }}" data-title="{{ song.title }}" aria-pressed="false" aria-label="Add {{ song.title }} to liked songs">&#9733;</button>
  </div>
  <p class="card-title">{{ song.title }}</p>
  <p class="card-artist">{{ song.artist }}</p>
</article>
